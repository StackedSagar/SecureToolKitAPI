name: Build and deploy ASP.NET Core app to Azure Web App - securetoolkitapi

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.x'
  API_PROJECT: './SecureToolKitAPI/SecureToolKitAPI.csproj'
  TEST_PROJECT: './SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj'
  PUBLISH_DIR: './publish'

jobs:

  # ============================================================
  # BUILD + TEST
  # ============================================================
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # --------------------------------------------------------
      # Restore API project
      # --------------------------------------------------------
      - name: Restore API
        run: dotnet restore "${{ env.API_PROJECT }}"

      # --------------------------------------------------------
      # Restore TEST project
      # --------------------------------------------------------
      - name: Restore tests
        run: dotnet restore "${{ env.TEST_PROJECT }}"

      # --------------------------------------------------------
      # Build API
      # --------------------------------------------------------
      - name: Build API
        run: dotnet build "${{ env.API_PROJECT }}" --configuration Release --no-restore

      # --------------------------------------------------------
      # Build tests
      # --------------------------------------------------------
      - name: Build tests
        run: dotnet build "${{ env.TEST_PROJECT }}" --configuration Release --no-restore

      # --------------------------------------------------------
      # Run tests
      # --------------------------------------------------------
      - name: Run tests
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration Release --no-build --no-restore

      # --------------------------------------------------------
      # Publish ONLY the API
      # --------------------------------------------------------
      - name: Publish API
        run: >
          dotnet publish "${{ env.API_PROJECT }}"
          --configuration Release
          --no-restore
          --output "${{ env.PUBLISH_DIR }}"

      # --------------------------------------------------------
      # Upload deployment artifact
      # --------------------------------------------------------
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: securetoolkitapi
          path: ${{ env.PUBLISH_DIR }}

  # ============================================================
  # DEPLOY TO AZURE
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # Download published API
      # --------------------------------------------------------
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: securetoolkitapi
          path: ./publish

      # --------------------------------------------------------
      # Login to Azure using OIDC
      # --------------------------------------------------------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Deploy API to Azure App Service
      # --------------------------------------------------------
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'securetoolkitapi'
          slot-name: 'Production'
          package: './publish'