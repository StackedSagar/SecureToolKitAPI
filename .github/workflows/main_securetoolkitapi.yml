name: Build and deploy ASP.NET Core API to Azure Web App - securetoolkitapi

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.x'
  SOLUTION_PATH: './SecureToolKitAPI.sln'
  API_PROJECT: './SecureToolKitAPI/SecureToolKitAPI.csproj'
  TEST_PROJECT: './SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj'
  PUBLISH_PATH: './myapp'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} \
          --configuration Release \
          --no-restore \
          --output ${{ env.PUBLISH_PATH }}

      - name: Verify published files
        run: |
          echo "Published files:"
          find ./myapp -maxdepth 1 -type f -printf '%f\n'

          echo "Checking API DLL..."
          test -f ./myapp/SecureToolKitAPI.dll

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: securetoolkit-api
          path: ./myapp
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: securetoolkit-api
          path: ./myapp

      - name: Verify deployment files
        run: |
          echo "Files to deploy:"
          find ./myapp -maxdepth 1 -type f -printf '%f\n'

          echo "Checking API DLL..."
          test -f ./myapp/SecureToolKitAPI.dll

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: securetoolkitapi
          slot-name: Production
          package: ./myapp