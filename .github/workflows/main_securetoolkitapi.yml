name: Build and deploy ASP.NET Core API to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore API
        run: dotnet restore ./SecureToolKitAPI/SecureToolKitAPI.csproj

      - name: Restore Tests
        run: dotnet restore ./SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj

      - name: Build API
        run: dotnet build ./SecureToolKitAPI/SecureToolKitAPI.csproj --configuration Release --no-restore

      - name: Build Tests
        run: dotnet build ./SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test ./SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj --configuration Release --no-build

      - name: Publish API
        run: dotnet publish ./SecureToolKitAPI/SecureToolKitAPI.csproj --configuration Release --no-restore --output ./myapp

      - name: Verify deployment files
        run: |
          echo "===== DEPLOYMENT FILES ====="
          find ./myapp -maxdepth 1 -type f -printf '%f\n'
          echo "===== RUNTIMECONFIG FILES ====="
          find ./myapp -name "*.runtimeconfig.json"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./myapp

      - name: Verify downloaded artifact
        run: |
          echo "===== DEPLOYMENT ARTIFACT ====="
          find ./myapp -maxdepth 1 -type f -printf '%f\n'
          echo "===== RUNTIMECONFIG FILES ====="
          find ./myapp -name "*.runtimeconfig.json"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: securetoolkitapi
          slot-name: Production
          package: ./myapp