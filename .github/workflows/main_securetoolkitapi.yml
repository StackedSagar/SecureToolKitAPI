name: Build and deploy ASP.NET Core API to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.x'
  API_PROJECT: './SecureToolKitAPI/SecureToolKitAPI.csproj'
  TEST_PROJECT: './SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj'
  PUBLISH_DIR: './myapp'
  AZURE_WEBAPP_NAME: 'securetoolkitapi'
  HEALTH_URL: 'https://securetoolkitapi-cna4bzadekchehg2.centralindia-01.azurewebsites.net/health'

jobs:

  # ============================================================
  # BUILD + TEST
  # ============================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore API
        run: dotnet restore "${{ env.API_PROJECT }}"

      - name: Restore Tests
        run: dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Build API
        run: dotnet build "${{ env.API_PROJECT }}" \
          --configuration Release \
          --no-restore

      - name: Build Tests
        run: dotnet build "${{ env.TEST_PROJECT }}" \
          --configuration Release \
          --no-restore

      - name: Run Tests
        run: dotnet test "${{ env.TEST_PROJECT }}" \
          --configuration Release \
          --no-build \
          --no-restore

      - name: Publish API
        run: dotnet publish "${{ env.API_PROJECT }}" \
          --configuration Release \
          --no-restore \
          --output "${{ env.PUBLISH_DIR }}"

      - name: Verify publish output
        run: |
          echo "=== Published files ==="
          find "${{ env.PUBLISH_DIR }}" -maxdepth 1 -type f -printf '%f\n'

          echo ""
          echo "=== Runtime config files ==="
          find "${{ env.PUBLISH_DIR }}" -name "*.runtimeconfig.json"

          echo ""
          echo "=== Checking API DLL ==="
          test -f "${{ env.PUBLISH_DIR }}/SecureToolKitAPI.dll"

          echo "API publish verified."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: securetoolkit-api
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: securetoolkit-api
          path: ./myapp

      - name: Verify deployment artifact
        run: |
          echo "=== Deployment files ==="
          find ./myapp -maxdepth 1 -type f -printf '%f\n'

          echo ""
          echo "=== Runtime config files ==="
          find ./myapp -name "*.runtimeconfig.json"

          test -f ./myapp/SecureToolKitAPI.dll

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./myapp

      # --------------------------------------------------------
      # HEALTH CHECK
      # --------------------------------------------------------
      - name: Wait for Azure App Service
        run: |
          echo "Waiting for Azure App Service to start..."
          sleep 30

      - name: Verify API health
        run: |
          echo "Checking:"
          echo "${{ env.HEALTH_URL }}"

          for i in {1..10}; do
            echo ""
            echo "Health check attempt $i/10..."

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/health-response.txt \
              --write-out "%{http_code}" \
              --max-time 15 \
              "${{ env.HEALTH_URL }}" || true)

            echo "HTTP Status: $HTTP_STATUS"

            echo "Response:"
            cat /tmp/health-response.txt || true

            if [ "$HTTP_STATUS" = "200" ]; then
              echo ""
              echo "✅ API is healthy."
              exit 0
            fi

            echo "API is not ready yet."
            sleep 15
          done

          echo ""
          echo "❌ API health check failed."
          exit 1