# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  API_PROJECT: './SecureToolKitAPI/SecureToolKitAPI.csproj'
  TEST_PROJECT: './SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj'

steps:

# ============================================================
# Install .NET 10
# ============================================================
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'


# ============================================================
# Restore
# ============================================================
- script: |
    dotnet restore "$(API_PROJECT)"
    dotnet restore "$(TEST_PROJECT)"
  displayName: 'Restore'


# ============================================================
# Build
# ============================================================
- script: |
    dotnet build "$(API_PROJECT)" \
      --configuration Release \
      --no-restore

    dotnet build "$(TEST_PROJECT)" \
      --configuration Release \
      --no-restore
  displayName: 'Build'


# ============================================================
# Install ReportGenerator
# ============================================================
- script: |
    dotnet tool install -g dotnet-reportgenerator-globaltool
    echo "##vso[task.prependpath]$HOME/.dotnet/tools"
  displayName: 'Install ReportGenerator'


# ============================================================
# Run tests using MICROSOFT Code Coverage
# ============================================================
- script: |
    dotnet test "$(TEST_PROJECT)" \
      --configuration Release \
      --no-build \
      --no-restore \
      --collect:"Code Coverage"
  displayName: 'Run tests with Microsoft Code Coverage'


# ============================================================
# Find Microsoft .coverage file
# ============================================================
- bash: |
    set -e

    COVERAGE_FILE=$(find "$(Build.SourcesDirectory)" \
      "$(Agent.TempDirectory)" \
      "$(Agent.BuildDirectory)" \
      -type f \
      -name "*.coverage" \
      -print -quit 2>/dev/null || true)

    if [ -z "$COVERAGE_FILE" ]; then
      echo "ERROR: Microsoft Code Coverage .coverage file was not found."
      exit 1
    fi

    echo "Microsoft Code Coverage file:"
    echo "$COVERAGE_FILE"

    echo "##vso[task.setvariable variable=CoverageFile]$COVERAGE_FILE"
  displayName: 'Locate Microsoft Code Coverage file'


# ============================================================
# Convert Microsoft .coverage -> Cobertura XML
# ============================================================
- bash: |
    set -e

    mkdir -p "$(Build.ArtifactStagingDirectory)/CodeCoverage"

    echo "Converting:"
    echo "$(CoverageFile)"

    reportgenerator \
      "-reports:$(CoverageFile)" \
      "-targetdir:$(Build.ArtifactStagingDirectory)/CodeCoverage" \
      "-reporttypes:Cobertura"

    echo ""
    echo "Generated coverage files:"
    find "$(Build.ArtifactStagingDirectory)/CodeCoverage" \
      -type f \
      -print

    if [ ! -f "$(Build.ArtifactStagingDirectory)/CodeCoverage/Cobertura.xml" ]; then
      echo "ERROR: ReportGenerator did not create Cobertura.xml"
      exit 1
    fi
  displayName: 'Convert coverage to Cobertura'


# ============================================================
# Publish Code Coverage to Azure DevOps
# ============================================================
- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage'
  inputs:
    summaryFileLocation: '$(Build.ArtifactStagingDirectory)/CodeCoverage/Cobertura.xml'
    pathToSources: '$(Build.SourcesDirectory)'
    failIfCoverageEmpty: true


# ============================================================
# Publish coverage artifact
# ============================================================
- task: PublishBuildArtifacts@1
  displayName: 'Publish coverage artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/CodeCoverage'
    ArtifactName: 'CodeCoverage'
    publishLocation: 'Container'

