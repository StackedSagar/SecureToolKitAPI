trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  API_PROJECT: './SecureToolKitAPI/SecureToolKitAPI.csproj'
  TEST_PROJECT: './SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj'
  TEST_RESULTS: '$(Agent.TempDirectory)/TestResults'
  MIN_LINE_COVERAGE: '80'

  # Azure Container Registry
  ACR_NAME: 'cloudlearning'
  ACR_LOGIN_SERVER: 'cloudlearning.azurecr.io'
  IMAGE_NAME: 'securetoolkitapi'
  IMAGE_TAG: '$(Build.BuildId)'

stages:

# ============================================================
# BUILD STAGE
# ============================================================

- stage: Build
  displayName: Build, Test and Docker Image

  jobs:

  - job: Build
    displayName: Build, Test and Docker Image

    steps:

    # --------------------------------------------------------
    # Install .NET
    # --------------------------------------------------------

    - task: UseDotNet@2
      displayName: Install .NET 10
      inputs:
        packageType: sdk
        version: 10.x

    # --------------------------------------------------------
    # Display .NET information
    # --------------------------------------------------------

    - script: |
        set -e

        echo "=========================================="
        echo " .NET INFORMATION"
        echo "=========================================="

        dotnet --info

        echo ""

        if [ -f "$(Build.SourcesDirectory)/global.json" ]; then
          echo "global.json:"
          cat "$(Build.SourcesDirectory)/global.json"
        fi

      displayName: Display .NET information

    # --------------------------------------------------------
    # Clean
    # --------------------------------------------------------

    - script: |
        set -e

        echo "=========================================="
        echo " CLEAN"
        echo "=========================================="

        rm -rf "$(Build.SourcesDirectory)/SecureToolKitAPI/bin"
        rm -rf "$(Build.SourcesDirectory)/SecureToolKitAPI/obj"

        rm -rf "$(Build.SourcesDirectory)/SecureToolKitAPI.Tests/bin"
        rm -rf "$(Build.SourcesDirectory)/SecureToolKitAPI.Tests/obj"

        rm -rf "$(TEST_RESULTS)"

        mkdir -p "$(TEST_RESULTS)"

      displayName: Clean

    # --------------------------------------------------------
    # Restore
    # --------------------------------------------------------

    - script: |
        set -e

        dotnet restore "$(API_PROJECT)"
        dotnet restore "$(TEST_PROJECT)"

      displayName: Restore

    # --------------------------------------------------------
    # Build API
    # --------------------------------------------------------

    - script: |
        set -e

        dotnet build "$(API_PROJECT)" \
          --configuration Release \
          --no-restore

      displayName: Build API

    # --------------------------------------------------------
    # Build Tests
    # --------------------------------------------------------

    - script: |
        set -e

        dotnet build "$(TEST_PROJECT)" \
          --configuration Release \
          --no-restore

      displayName: Build tests

    # --------------------------------------------------------
    # Run Tests + Coverage
    # --------------------------------------------------------

    - script: |
        set -e

        echo "=========================================="
        echo " TESTS + CODE COVERAGE"
        echo "=========================================="

        dotnet test "$(TEST_PROJECT)" \
          --configuration Release \
          --no-build \
          --no-restore \
          --results-directory "$(TEST_RESULTS)" \
          --settings "$(Build.SourcesDirectory)/coverlet.runsettings"

      displayName: Run tests and collect coverage

    # --------------------------------------------------------
    # Find Coverage Report
    # --------------------------------------------------------

    - script: |
        set -e

        echo "=========================================="
        echo " FIND COVERAGE REPORT"
        echo "=========================================="

        COVERAGE_FILE=$(find "$(TEST_RESULTS)" \
          -type f \
          -name "*.cobertura.xml" \
          | head -n 1)

        if [ -z "$COVERAGE_FILE" ]; then
          echo "ERROR: No Cobertura coverage file found."

          find "$(TEST_RESULTS)" -type f -print || true

          exit 1
        fi

        echo "Coverage file:"
        echo "$COVERAGE_FILE"

        echo "##vso[task.setvariable variable=COVERAGE_FILE]$COVERAGE_FILE"

      displayName: Find coverage report

    # --------------------------------------------------------
    # Coverage Quality Gate
    # --------------------------------------------------------

    - script: |
        set -e

        echo "=========================================="
        echo " CODE COVERAGE QUALITY GATE"
        echo "=========================================="

        FILE="$(COVERAGE_FILE)"

        if [ ! -f "$FILE" ]; then
          echo "ERROR: Coverage file not found."
          exit 1
        fi

        LINE_RATE=$(grep -o 'line-rate="[^"]*"' "$FILE" \
          | head -n 1 \
          | cut -d'"' -f2)

        if [ -z "$LINE_RATE" ]; then
          echo "ERROR: Could not read line-rate from Cobertura report."
          exit 1
        fi

        COVERAGE=$(awk "BEGIN { printf \"%.2f\", $LINE_RATE * 100 }")

        echo ""
        echo "=========================================="
        echo " COVERAGE RESULT"
        echo "=========================================="

        echo "Required coverage : $(MIN_LINE_COVERAGE)%"
        echo "Actual coverage   : $COVERAGE%"

        awk \
          -v actual="$COVERAGE" \
          -v minimum="$(MIN_LINE_COVERAGE)" \
          'BEGIN {
            if (actual >= minimum) {
              print ""
              print "QUALITY GATE: PASSED"
              printf "Coverage %.2f%% >= %.2f%%\n", actual, minimum
              exit 0
            }

            print ""
            print "QUALITY GATE: FAILED"
            printf "Coverage %.2f%% < %.2f%%\n", actual, minimum
            exit 1
          }'

      displayName: Enforce coverage quality gate

    # --------------------------------------------------------
    # Publish Coverage
    # --------------------------------------------------------

    - task: PublishCodeCoverageResults@2
      displayName: Publish code coverage
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/*.cobertura.xml'
        pathToSources: '$(Build.SourcesDirectory)'
        failIfCoverageEmpty: true

    # ========================================================
    # DOCKER BUILD
    # ========================================================

    - script: |
        set -e

        echo "=========================================="
        echo " DOCKER BUILD"
        echo "=========================================="

        echo "Docker version:"
        docker --version

        echo ""
        echo "Building:"
        echo "$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(IMAGE_TAG)"

        docker build \
          --file "$(Build.SourcesDirectory)/Dockerfile" \
          --tag "$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(IMAGE_TAG)" \
          "$(Build.SourcesDirectory)"

      displayName: Build Docker image

    # ========================================================
    # LOGIN TO AZURE
    # ========================================================

    - task: AzureCLI@2
      displayName: Login to Azure Container Registry
      inputs:
        azureSubscription: 'Azure-SecureToolKitAPI'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          echo "=========================================="
          echo " ACR LOGIN"
          echo "=========================================="

          az account show

          az acr login \
            --name "$(ACR_NAME)"

    # ========================================================
    # PUSH DOCKER IMAGE
    # ========================================================

    - script: |
        set -e

        echo "=========================================="
        echo " PUSH DOCKER IMAGE"
        echo "=========================================="

        docker push "$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(IMAGE_TAG)"

        echo ""
        echo "Docker image pushed successfully:"
        echo "$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(IMAGE_TAG)"

      displayName: Push Docker image to ACR


# ============================================================
# DEPLOY STAGE
# ============================================================

- stage: Deploy
  displayName: Deploy Container to Production
  dependsOn: Build
  condition: succeeded()

  jobs:

  - deployment: Deploy
    displayName: Deploy API Container to Production
    environment: Production

    strategy:
      runOnce:

        deploy:

          steps:

          # --------------------------------------------------
          # Deploy Docker image to App Service
          # --------------------------------------------------

          - task: AzureWebAppContainer@1
            displayName: Deploy Docker image to Azure App Service
            inputs:
              azureSubscription: 'Azure-SecureToolKitAPI'
              appName: 'securetoolkitapi'
              containers: 'cloudlearning.azurecr.io/securetoolkitapi:$(Build.BuildId)'