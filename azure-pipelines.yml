# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml
trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  API_PROJECT: './SecureToolKitAPI/SecureToolKitAPI.csproj'
  TEST_PROJECT: './SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj'
  COVERAGE_DIR: '$(Build.ArtifactStagingDirectory)/CodeCoverage'

steps:

# =========================================================
# Restore API
# =========================================================
- script: |
    dotnet restore "$(API_PROJECT)"
  displayName: 'Restore .NET API'


# =========================================================
# Build API
# =========================================================
- script: |
    dotnet build "$(API_PROJECT)" --no-restore
  displayName: 'Build .NET API'


# =========================================================
# Restore tests
# =========================================================
- script: |
    dotnet restore "$(TEST_PROJECT)"
  displayName: 'Restore .NET tests'


# =========================================================
# Create Microsoft Code Coverage settings
# =========================================================
- script: |
    cat > "$(Build.SourcesDirectory)/coverage.runsettings" <<'EOF'
    <?xml version="1.0" encoding="utf-8"?>
    <RunSettings>
      <DataCollectionRunSettings>
        <DataCollectors>
          <DataCollector friendlyName="Code Coverage">
            <Configuration>
              <Format>cobertura</Format>
            </Configuration>
          </DataCollector>
        </DataCollectors>
      </DataCollectionRunSettings>
    </RunSettings>
    EOF

    echo "Created coverage.runsettings:"
    cat "$(Build.SourcesDirectory)/coverage.runsettings"
  displayName: 'Create Microsoft Code Coverage settings'


# =========================================================
# Run tests with Microsoft Code Coverage
# =========================================================
- script: |
    dotnet test "$(TEST_PROJECT)" \
      --no-restore \
      --collect:"Code Coverage" \
      --settings "$(Build.SourcesDirectory)/coverage.runsettings"
  displayName: 'Run tests with Microsoft Code Coverage'


# =========================================================
# Find coverage output
# =========================================================
- script: |
    echo "Searching for coverage files..."

    echo ""
    echo "=== .coverage files ==="
    find "$(Build.SourcesDirectory)" \
      -type f \
      -name "*.coverage" \
      -print

    echo ""
    echo "=== Cobertura files ==="
    find "$(Build.SourcesDirectory)" \
      -type f \
      -iname "*cobertura*.xml" \
      -print

    echo ""
    echo "=== TestResults ==="
    find "$(Build.SourcesDirectory)" \
      -path "*/TestResults/*" \
      -type f \
      -print
  displayName: 'Find coverage output'


# =========================================================
# Locate Cobertura report
# =========================================================
- script: |
    COVERAGE_XML=$(find "$(Build.SourcesDirectory)" \
      -type f \
      -name "coverage.cobertura.xml" \
      -print -quit)

    if [ -z "$COVERAGE_XML" ]; then
      echo "ERROR: coverage.cobertura.xml was not found."
      exit 1
    fi

    echo "Coverage report found:"
    echo "$COVERAGE_XML"

    mkdir -p "$(COVERAGE_DIR)"

    cp "$COVERAGE_XML" "$(COVERAGE_DIR)/coverage.cobertura.xml"
  displayName: 'Prepare Cobertura report'


# =========================================================
# Verify Cobertura report
# =========================================================
- script: |
    echo "Coverage report:"
    echo "================"

    if [ ! -f "$(COVERAGE_DIR)/coverage.cobertura.xml" ]; then
      echo "ERROR: Coverage report does not exist."
      exit 1
    fi

    head -100 "$(COVERAGE_DIR)/coverage.cobertura.xml"
  displayName: 'Verify coverage report'


# =========================================================
# Publish code coverage
# =========================================================
- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage'
  inputs:
    summaryFileLocation: '$(COVERAGE_DIR)/coverage.cobertura.xml'
    failIfCoverageEmpty: true