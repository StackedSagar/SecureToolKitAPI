# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  API_PROJECT: './SecureToolKitAPI/SecureToolKitAPI.csproj'
  TEST_PROJECT: './SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj'
  TEST_RESULTS: '$(Agent.TempDirectory)/TestResults'

steps:

# --------------------------------------------------
# Install .NET 10
# --------------------------------------------------
- task: UseDotNet@2
  displayName: 'Install .NET 10'
  inputs:
    packageType: 'sdk'
    version: '10.0.400'


# --------------------------------------------------
# Verify .NET + global.json
# --------------------------------------------------
- script: |
    set -e

    echo "=========================================="
    echo " .NET INFORMATION"
    echo "=========================================="

    dotnet --info

    echo ""
    echo "=========================================="
    echo " GLOBAL.JSON"
    echo "=========================================="

    if [ -f "$(Build.SourcesDirectory)/global.json" ]; then
      cat "$(Build.SourcesDirectory)/global.json"
    else
      echo "ERROR: global.json was not found!"
      exit 1
    fi

    echo ""
    echo "=========================================="
    echo " TEST RUNNER"
    echo "=========================================="

    dotnet test --help | head -80

  displayName: 'Verify .NET and Microsoft Testing Platform'


# --------------------------------------------------
# Clean previous build artifacts
# --------------------------------------------------
- script: |
    set -e

    echo "=========================================="
    echo " CLEAN"
    echo "=========================================="

    rm -rf "$(Build.SourcesDirectory)/SecureToolKitAPI/bin"
    rm -rf "$(Build.SourcesDirectory)/SecureToolKitAPI/obj"

    rm -rf "$(Build.SourcesDirectory)/SecureToolKitAPI.Tests/bin"
    rm -rf "$(Build.SourcesDirectory)/SecureToolKitAPI.Tests/obj"

    rm -rf "$(TEST_RESULTS)"

    mkdir -p "$(TEST_RESULTS)"

  displayName: 'Clean build and test artifacts'


# --------------------------------------------------
# Restore
# --------------------------------------------------
- script: |
    set -e

    echo "=========================================="
    echo " RESTORE"
    echo "=========================================="

    dotnet restore "$(TEST_PROJECT)"

  displayName: 'Restore projects'


# --------------------------------------------------
# Build API
# --------------------------------------------------
- script: |
    set -e

    echo "=========================================="
    echo " BUILD API"
    echo "=========================================="

    dotnet build "$(API_PROJECT)" \
      --configuration Release \
      --no-restore

  displayName: 'Build API'


# --------------------------------------------------
# Build Tests
# --------------------------------------------------
- script: |
    set -e

    echo "=========================================="
    echo " BUILD TESTS"
    echo "=========================================="

    dotnet build "$(TEST_PROJECT)" \
      --configuration Release \
      --no-restore

  displayName: 'Build tests'


# --------------------------------------------------
# Run Tests + Native Microsoft Code Coverage
# --------------------------------------------------
- script: |
    set -e

    echo "=========================================="
    echo " RUN TESTS + CODE COVERAGE"
    echo "=========================================="

    dotnet test "$(TEST_PROJECT)" \
      --configuration Release \
      --no-build \
      --no-restore \
      --results-directory "$(TEST_RESULTS)" \
      --coverage \
      --coverage-output-format cobertura

  displayName: 'Run tests and collect code coverage'


# --------------------------------------------------
# Show generated coverage files
# --------------------------------------------------
- script: |
    echo "=========================================="
    echo " COVERAGE FILES"
    echo "=========================================="

    echo ""
    echo "TestResults directory:"
    find "$(TEST_RESULTS)" \
      -type f \
      -print || true

    echo ""
    echo "All Cobertura files:"
    find "$(Build.SourcesDirectory)" \
      -type f \
      -name "*.cobertura.xml" \
      -print || true

    echo ""
    echo "All coverage files:"
    find "$(TEST_RESULTS)" \
      -type f \
      \( \
        -name "*.cobertura.xml" \
        -o -name "*.xml" \
        -o -name "*.coverage" \
      \) \
      -print || true

  displayName: 'Locate coverage results'


# --------------------------------------------------
# Publish Code Coverage
# --------------------------------------------------
- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage'
  inputs:
    summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/*.cobertura.xml'
    pathToSources: '$(Build.SourcesDirectory)'
    failIfCoverageEmpty: true