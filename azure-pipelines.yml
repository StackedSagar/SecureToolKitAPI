# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest
variables:
  API_PROJECT: './SecureToolKitAPI/SecureToolKitAPI.csproj'
  TEST_PROJECT: './SecureToolKitAPI.Tests/SecureToolKitAPI.Tests.csproj'

steps:

- script: dotnet restore $(API_PROJECT)
  displayName: 'Restore .NET API'

- script: dotnet build $(API_PROJECT) --no-restore
  displayName: 'Build .NET API'

- script: dotnet restore $(TEST_PROJECT)
  displayName: 'Restore .NET tests'

- script: |
    dotnet test $(TEST_PROJECT) --no-restore --collect:"Code Coverage"
  displayName: 'Run .NET tests with Microsoft Code Coverage'

- script: dotnet tool install -g dotnet-reportgenerator-globaltool
  displayName: 'Install ReportGenerator'

- script: |
    reportgenerator \
      "-reports:$(Build.SourcesDirectory)/**/*.coverage" \
      "-targetdir:$(Build.ArtifactStagingDirectory)/CodeCoverage" \
      "-reporttypes:Cobertura"
  displayName: 'Convert coverage to Cobertura'

- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage'
  inputs:
    summaryFileLocation: '$(Build.ArtifactStagingDirectory)/CodeCoverage/Cobertura.xml'
    failIfCoverageEmpty: true